name: patrn

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: patrn-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - patrn
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${ECR_REGISTRY}/${ECR_API_REPOSITORY}:${API_IMAGE_TAG}
    container_name: patrn-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      ENVIRONMENT: production
      BASE_URL: https://api.patrn.ink
      FRONTEND_URL: https://patrn.ink
      ALLOWED_ORIGINS: https://patrn.ink
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://api.patrn.ink/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: https://api.patrn.ink/auth/github/callback
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-168}
      AWS_REGION: ${AWS_REGION}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-60}
      API_TOKEN_RATE_LIMIT: ${API_TOKEN_RATE_LIMIT:-100}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - patrn
    logging: *default-logging

  ui:
    image: ${ECR_REGISTRY}/${ECR_UI_REPOSITORY}:${UI_IMAGE_TAG}
    container_name: patrn-ui
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - patrn
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: patrn-nginx
    restart: unless-stopped
    depends_on:
      - api
      - ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro
    networks:
      - patrn
    logging: *default-logging

volumes:
  redis-data:
  certbot-www:
  certbot-etc:

networks:
  patrn:
    driver: bridge
