# HTTP bootstrap: serve ACME challenges and proxy to the apps.
# enable-https.sh replaces this with HTTP→HTTPS redirects after certificates exist.

server {
    listen 80;
    server_name patrn.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://ui:3000;
    }
}

server {
    listen 80;
    server_name api.patrn.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /metrics {
        return 404;
    }

    location / {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api:8080;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
