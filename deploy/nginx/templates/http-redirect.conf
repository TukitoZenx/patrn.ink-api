# Installed by enable-https.sh as conf.d/http.conf

server {
    listen 80;
    server_name patrn.ink api.patrn.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
