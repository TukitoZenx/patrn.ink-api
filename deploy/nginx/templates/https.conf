# Installed by enable-https.sh as conf.d/https.conf once certificates exist.

server {
    listen 443 ssl;
    http2 on;
    server_name patrn.ink;

    ssl_certificate     /etc/letsencrypt/live/patrn.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrn.ink/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://ui:3000;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.patrn.ink;

    ssl_certificate     /etc/letsencrypt/live/patrn.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrn.ink/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /metrics {
        return 404;
    }

    location / {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api:8080;
    }
}
