version: "3.8"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      # Override specific values if needed
      - PORT=8080
      - ENVIRONMENT=production
    restart: always
    # For production, you might want to add:
    # - Health checks
    # - Resource limits
    # - Logging configuration
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Note: In production, you would typically use:
  # - AWS ElastiCache for Redis (not a container)
  # - AWS DynamoDB (not local)
  # 
  # If you still want to run Redis in Docker for production:
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  redis-data:
