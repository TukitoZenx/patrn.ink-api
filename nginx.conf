events {
    worker_connections 1024;
}

http {
    # Upstream backend servers
    upstream api_backend {
        least_conn;  # Use least connections load balancing
        
        server api-1:8080 max_fails=3 fail_timeout=30s;
        server api-2:8080 max_fails=3 fail_timeout=30s;
        server api-3:8080 max_fails=3 fail_timeout=30s;
    }

    # Health check configuration
    server {
        listen 80;
        server_name _;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass through request ID if exists, otherwise nginx will add one
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Health check endpoint (direct, no load balancing)
        location /health {
            proxy_pass http://api_backend/health;
            proxy_next_upstream error timeout http_503;
        }

        # All other requests
        location / {
            proxy_pass http://api_backend;
            proxy_next_upstream error timeout http_503;
            
            # Enable keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
